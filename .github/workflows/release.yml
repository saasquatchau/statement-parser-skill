# Pushing a version tag (e.g. v1.0.0) tests the skill and publishes statement-parser.skill as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Without it the scanned-statement (OCR) test is skipped.
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Build the skill
        run: python scripts/build_skill.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/statement-parser.skill --title "$GITHUB_REF_NAME" --generate-notes
